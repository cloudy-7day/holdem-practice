<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10271f"><title>好友教学桌 · PokerTH</title><link rel="stylesheet" href="modules/multiplayer/style.css?v=3.2.0"></head>
<body class="mp-page"><header class="top"><a class="brand" href="index.html">POKER<span>TH</span></a><span>好友教学桌</span><button id="sound" aria-pressed="false">声音：关</button></header>
<main><section id="entry" class="entry"><div class="eyebrow">FRIENDS AT THE FELT</div><h1>隔着屏幕，<br>也能坐一桌。</h1><p>邀请朋友一起练牌，每手结束后慢慢聊。</p><form id="entry-form"><label>你的昵称<input id="name" autocomplete="nickname" maxlength="24" required placeholder="桌上的你"></label><div class="config"><label>牌桌人数<select id="seats"><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option></select></label><label class="check"><input id="bots" type="checkbox" checked>空位由电脑补齐</label></div><button id="create" disabled class="gold" type="submit">创建好友桌 →</button><div class="divider">已有邀请？</div><label id="join-code-field">房间码<input id="code" autocapitalize="characters" autocomplete="off" maxlength="16" placeholder="输入房间码"></label><button id="join" disabled type="button">加入好友桌</button></form><p class="rules">教学约定：对局中只看得到自己的底牌；每手结束后，所有人的底牌都会公开，供一起复盘。每次行动限时 60 秒，超时自动过牌或弃牌。仅使用虚拟筹码。</p><a href="index.html">返回首页 · 选择玩法</a></section>
<section id="room" hidden><div class="room-bar"><div><span class="eyebrow">好友房间</span><strong id="room-code"></strong></div><button id="invite">复制邀请</button><button id="leave">离桌</button></div><div class="game-meta"><span id="phase"></span><span id="clock"></span></div><div class="table-wrap"><div class="felt"><div class="table-center"><span class="table-logo">POKERTH</span><div id="board" class="cards board"></div><div class="pot">底池 <strong id="pot">0</strong></div></div><div id="players"></div></div></div><p id="speech" class="speech" aria-live="polite"></p><section class="controls"><p id="turn-label"></p><div id="actions" class="action-row"><button id="fold">弃牌</button><button id="check">过牌</button><button id="call">跟注</button></div><div id="raise-row" class="raise-row"><label>本轮加到<input id="amount" type="number" inputmode="numeric" min="0" step="1"></label><button id="raise" class="gold">加注</button></div><p id="raise-hint" class="hint"></p><button id="start" class="gold" hidden>开始第一手 →</button><button id="next" class="gold" hidden>发下一手 →</button><p id="waiting" class="hint"></p></section><section id="review" class="review" hidden></section></section>
<div id="status" class="status" role="status" aria-live="polite">正在连接牌桌服务…</div><button id="retry" hidden>重新连接</button></main><footer>60 秒行动时间 · 手后公开底牌 · 虚拟筹码教学 · <a href="SOURCE.md">源码与许可</a></footer><script type="module" src="modules/multiplayer/client.mjs?v=3.2.0"></script></body></html>
